<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora científica</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #141a22;
        --btn: #1b232d;
        --btn-op: #222b37;
        --btn-sci: #1e2733;
        --fg: #e6eaef;
        --muted: #8a95a3;
        --border: #222b37;
        --accent: #3b82f6;
        --accent-fg: #fff;
        --danger: #f87171;
      }
      [data-theme='light'] {
        --bg: #fff;
        --panel: #f4f6f8;
        --btn: #f4f6f8;
        --btn-op: #e6eaef;
        --btn-sci: #eceff3;
        --fg: #0b0f14;
        --muted: #5b6573;
        --border: #e1e5eb;
        --danger: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 24px;
        transition: background 0.2s, color 0.2s;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 { font-size: 18px; margin: 0; font-weight: 600; }
      #theme {
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 999px;
        width: 40px;
        height: 40px;
        cursor: pointer;
        font-size: 18px;
      }
      main {
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
      }
      @media (min-width: 900px) {
        main { grid-template-columns: minmax(0, 1fr) 320px; }
      }
      .display {
        background: var(--panel);
        border-radius: 16px;
        padding: 20px 24px;
        min-height: 140px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .deg { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
      .expr {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        color: var(--muted);
        font-size: 20px;
        text-align: right;
        min-height: 28px;
        word-break: break-all;
      }
      .result {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 40px;
        font-weight: 600;
        text-align: right;
        word-break: break-all;
        font-variant-numeric: tabular-nums;
      }
      .result.error { color: var(--danger); font-size: 22px; }
      .keypad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      button.k {
        font-family: inherit;
        font-size: 18px;
        padding: 14px 0;
        border: none;
        border-radius: 12px;
        background: var(--btn);
        color: var(--fg);
        cursor: pointer;
        min-height: 48px;
        transition: filter 0.08s, transform 0.08s;
      }
      button.k:hover { filter: brightness(1.1); }
      button.k:active { transform: scale(0.97); }
      button.k.op { background: var(--btn-op); }
      button.k.sci { background: var(--btn-sci); font-size: 16px; }
      button.k.util { background: var(--btn-sci); color: var(--muted); }
      button.k.eq { background: var(--accent); color: var(--accent-fg); }
      button.k.wide { grid-column: span 2; }
      button.k:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      aside {
        background: var(--panel);
        border-radius: 16px;
        padding: 16px;
        max-height: 600px;
        display: flex;
        flex-direction: column;
      }
      aside h2 {
        font-size: 14px;
        margin: 0 0 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      aside h2 button {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 14px;
      }
      aside h2 button:hover { color: var(--danger); }
      .history {
        flex: 1;
        overflow-y: auto;
        margin: 0 -8px;
      }
      .entry {
        display: block;
        width: 100%;
        background: none;
        border: none;
        border-bottom: 1px solid var(--border);
        padding: 10px 8px;
        text-align: left;
        cursor: pointer;
        color: var(--fg);
        font-family: inherit;
      }
      .entry:last-child { border-bottom: none; }
      .entry:hover { background: var(--btn); border-radius: 8px; }
      .entry .e-expr {
        font-family: ui-monospace, monospace;
        color: var(--muted);
        font-size: 13px;
        word-break: break-all;
      }
      .entry .e-res {
        font-family: ui-monospace, monospace;
        font-size: 15px;
        text-align: right;
        word-break: break-all;
      }
      .entry .e-time { color: var(--muted); font-size: 11px; margin-top: 2px; }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 40px 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Calculadora científica</h1>
        <button id="theme" aria-label="cambiar tema">☼</button>
      </header>
      <main>
        <section style="display: grid; gap: 12px">
          <div class="display">
            <div class="deg">DEG</div>
            <div>
              <div class="expr" id="expr">&nbsp;</div>
              <div class="result" id="result">0</div>
            </div>
          </div>
          <div class="keypad" id="keypad"></div>
        </section>
        <aside>
          <h2>
            <span>Historial</span>
            <button id="clear-hist" title="borrar historial">borrar</button>
          </h2>
          <div class="history" id="history"></div>
        </aside>
      </main>
    </div>

    <script>
      // ---------- Motor de cálculo ----------
      const DEG = Math.PI / 180;

      function tokenize(s) {
        s = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/√/g, 'sqrt');
        const out = [];
        let i = 0;
        while (i < s.length) {
          const c = s[i];
          if (c === ' ') { i++; continue; }
          if ((c >= '0' && c <= '9') || c === '.') {
            let j = i;
            while (j < s.length && ((s[j] >= '0' && s[j] <= '9') || s[j] === '.')) j++;
            out.push({ t: 'num', v: parseFloat(s.slice(i, j)) });
            i = j;
            continue;
          }
          if ('+-*/^'.includes(c)) { out.push({ t: 'op', v: c }); i++; continue; }
          if (c === '(') { out.push({ t: 'lp' }); i++; continue; }
          if (c === ')') { out.push({ t: 'rp' }); i++; continue; }
          if (c === '!') { out.push({ t: 'fact' }); i++; continue; }
          if (c === 'π') { out.push({ t: 'const', v: 'PI' }); i++; continue; }
          if (/[a-z]/i.test(c)) {
            let j = i;
            while (j < s.length && /[a-z]/i.test(s[j])) j++;
            const w = s.slice(i, j);
            if (w === 'pi') out.push({ t: 'const', v: 'PI' });
            else if (w === 'e') out.push({ t: 'const', v: 'E' });
            else if (['log', 'ln', 'sin', 'cos', 'tan', 'sqrt'].includes(w))
              out.push({ t: 'fn', v: w });
            else throw new Error('Símbolo desconocido: ' + w);
            i = j;
            continue;
          }
          throw new Error('Carácter inválido: ' + c);
        }
        return out;
      }

      function parse(tokens) {
        let p = 0;
        const peek = () => tokens[p];
        const eat = () => {
          if (p >= tokens.length) throw new Error('Expresión incompleta');
          return tokens[p++];
        };
        function expr() { return add(); }
        function add() {
          let l = mul();
          while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '-')) {
            const op = eat().v;
            l = { type: 'bin', op, l, r: mul() };
          }
          return l;
        }
        function mul() {
          let l = unary();
          while (peek() && peek().t === 'op' && (peek().v === '*' || peek().v === '/')) {
            const op = eat().v;
            l = { type: 'bin', op, l, r: unary() };
          }
          return l;
        }
        function unary() {
          if (peek() && peek().t === 'op' && peek().v === '-') {
            eat();
            return { type: 'neg', x: unary() };
          }
          if (peek() && peek().t === 'op' && peek().v === '+') { eat(); return unary(); }
          return pow();
        }
        function pow() {
          const base = postfix();
          if (peek() && peek().t === 'op' && peek().v === '^') {
            eat();
            return { type: 'bin', op: '^', l: base, r: unary() };
          }
          return base;
        }
        function postfix() {
          let n = primary();
          while (peek() && peek().t === 'fact') { eat(); n = { type: 'fact', x: n }; }
          return n;
        }
        function primary() {
          const t = eat();
          if (t.t === 'num') return { type: 'num', v: t.v };
          if (t.t === 'const') return { type: 'const', v: t.v };
          if (t.t === 'lp') {
            const e = expr();
            const r = eat();
            if (r.t !== 'rp') throw new Error('Falta )');
            return e;
          }
          if (t.t === 'fn') {
            const lp = eat();
            if (lp.t !== 'lp') throw new Error('Falta (');
            const arg = expr();
            const rp = eat();
            if (rp.t !== 'rp') throw new Error('Falta )');
            return { type: 'call', fn: t.v, arg };
          }
          throw new Error('Expresión incompleta');
        }
        const ast = expr();
        if (p !== tokens.length) throw new Error('Sobran tokens');
        return ast;
      }

      function ev(n) {
        if (n.type === 'num') return n.v;
        if (n.type === 'const') return n.v === 'PI' ? Math.PI : Math.E;
        if (n.type === 'neg') return -ev(n.x);
        if (n.type === 'fact') {
          const x = ev(n.x);
          if (!Number.isInteger(x) || x < 0)
            throw new Error('Factorial solo para enteros ≥ 0');
          if (x > 170) throw new Error('Resultado fuera de rango');
          let r = 1;
          for (let i = 2; i <= x; i++) r *= i;
          return r;
        }
        if (n.type === 'bin') {
          const a = ev(n.l), b = ev(n.r);
          if (n.op === '+') return a + b;
          if (n.op === '-') return a - b;
          if (n.op === '*') return a * b;
          if (n.op === '/') {
            if (b === 0) throw new Error('División por cero');
            return a / b;
          }
          if (n.op === '^') return Math.pow(a, b);
        }
        if (n.type === 'call') {
          const a = ev(n.arg);
          if (n.fn === 'sin') return Math.sin(a * DEG);
          if (n.fn === 'cos') return Math.cos(a * DEG);
          if (n.fn === 'tan') return Math.tan(a * DEG);
          if (n.fn === 'log') {
            if (a <= 0) throw new Error('Logaritmo de cero o negativo');
            return Math.log10(a);
          }
          if (n.fn === 'ln') {
            if (a <= 0) throw new Error('Logaritmo de cero o negativo');
            return Math.log(a);
          }
          if (n.fn === 'sqrt') {
            if (a < 0) throw new Error('Raíz de número negativo');
            return Math.sqrt(a);
          }
        }
        throw new Error('Expresión inválida');
      }

      function fmt(n) {
        if (!Number.isFinite(n)) throw new Error('Resultado fuera de rango');
        if (n === 0) return '0';
        const abs = Math.abs(n);
        if (abs >= 1e16 || abs < 1e-9) return n.toExponential(6).replace(/\.?0+e/, 'e');
        if (Number.isInteger(n)) return n.toString();
        return parseFloat(n.toPrecision(12)).toString();
      }

      function compute(s) {
        return fmt(ev(parse(tokenize(s))));
      }

      // ---------- Estado ----------
      const HIST_KEY = 'calc.history.v1';
      const THEME_KEY = 'calc.theme';
      const state = {
        expr: '',
        result: '0',
        error: null,
        history: loadHist(),
      };

      function loadHist() {
        try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }
        catch { return []; }
      }
      function saveHist() {
        try { localStorage.setItem(HIST_KEY, JSON.stringify(state.history.slice(0, 100))); }
        catch {}
      }

      // ---------- Render ----------
      const exprEl = document.getElementById('expr');
      const resultEl = document.getElementById('result');
      const historyEl = document.getElementById('history');

      function render() {
        exprEl.textContent = state.expr || ' ';
        if (state.error) {
          resultEl.textContent = state.error;
          resultEl.classList.add('error');
        } else {
          resultEl.textContent = state.result;
          resultEl.classList.remove('error');
        }
        renderHistory();
      }

      function timeAgo(t) {
        const s = Math.floor((Date.now() - t) / 1000);
        if (s < 60) return 'hace unos segundos';
        if (s < 3600) return 'hace ' + Math.floor(s / 60) + ' min';
        if (s < 86400) return 'hace ' + Math.floor(s / 3600) + ' h';
        return 'hace ' + Math.floor(s / 86400) + ' d';
      }

      function renderHistory() {
        if (state.history.length === 0) {
          historyEl.innerHTML = '<div class="empty">Sin operaciones todavía</div>';
          return;
        }
        historyEl.innerHTML = '';
        for (const e of state.history) {
          const btn = document.createElement('button');
          btn.className = 'entry';
          btn.innerHTML =
            '<div class="e-expr"></div><div class="e-res"></div><div class="e-time"></div>';
          btn.querySelector('.e-expr').textContent = e.expression;
          btn.querySelector('.e-res').textContent = '= ' + e.result;
          btn.querySelector('.e-time').textContent = timeAgo(e.timestamp);
          btn.onclick = () => {
            state.expr = e.expression;
            state.error = null;
            render();
          };
          historyEl.appendChild(btn);
        }
      }

      // ---------- Acciones ----------
      function input(s) {
        if (state.error) { state.error = null; state.expr = ''; state.result = '0'; }
        state.expr += s;
        render();
      }
      function inputOp(o) {
        if (state.error) { state.error = null; state.expr = state.result; state.result = '0'; }
        if (state.expr === '' && o !== '−') return;
        const last = state.expr.slice(-1);
        if ('+−×÷^'.includes(last)) state.expr = state.expr.slice(0, -1);
        state.expr += o;
        render();
      }
      function inputFn(name) {
        if (state.error) { state.error = null; state.expr = ''; state.result = '0'; }
        state.expr += name === 'sqrt' ? '√(' : name + '(';
        render();
      }
      function backspace() {
        if (state.error) { state.error = null; state.expr = ''; state.result = '0'; }
        else state.expr = state.expr.slice(0, -1);
        render();
      }
      function clearAll() {
        state.expr = ''; state.result = '0'; state.error = null;
        render();
      }
      function clearEntry() {
        state.expr = ''; state.error = null;
        render();
      }
      function evaluate() {
        if (state.expr === '') return;
        try {
          const r = compute(state.expr);
          state.history.unshift({
            id: Date.now() + Math.random().toString(36).slice(2),
            expression: state.expr,
            result: r,
            timestamp: Date.now(),
          });
          state.history = state.history.slice(0, 100);
          saveHist();
          state.result = r;
          state.expr = '';
          state.error = null;
        } catch (e) {
          state.error = e.message;
          state.result = '0';
        }
        render();
      }
      function clearHist() {
        state.history = [];
        saveHist();
        render();
      }

      // ---------- Botones ----------
      const BUTTONS = [
        ['sin', 'sci', () => inputFn('sin')],
        ['cos', 'sci', () => inputFn('cos')],
        ['tan', 'sci', () => inputFn('tan')],
        ['log', 'sci', () => inputFn('log')],
        ['ln', 'sci', () => inputFn('ln')],
        ['√', 'sci', () => inputFn('sqrt')],
        ['x^y', 'sci', () => inputOp('^')],
        ['n!', 'sci', () => input('!')],
        ['(', 'util', () => input('(')],
        [')', 'util', () => input(')')],
        ['π', 'sci', () => input('π')],
        ['e', 'sci', () => input('e')],
        ['AC', 'util', clearAll],
        ['C', 'util', clearEntry],
        ['⌫', 'util', backspace],
        ['÷', 'op', () => inputOp('÷')],
        ['7', '', () => input('7')],
        ['8', '', () => input('8')],
        ['9', '', () => input('9')],
        ['×', 'op', () => inputOp('×')],
        ['4', '', () => input('4')],
        ['5', '', () => input('5')],
        ['6', '', () => input('6')],
        ['−', 'op', () => inputOp('−')],
        ['1', '', () => input('1')],
        ['2', '', () => input('2')],
        ['3', '', () => input('3')],
        ['+', 'op', () => inputOp('+')],
        ['0', 'wide', () => input('0')],
        ['.', '', () => input('.')],
        ['=', 'eq', evaluate],
      ];
      const keypad = document.getElementById('keypad');
      for (const [label, cls, handler] of BUTTONS) {
        const b = document.createElement('button');
        b.className = 'k' + (cls ? ' ' + cls : '');
        b.textContent = label;
        b.onclick = handler;
        keypad.appendChild(b);
      }

      // ---------- Tema ----------
      const themeBtn = document.getElementById('theme');
      function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        themeBtn.textContent = t === 'dark' ? '☼' : '☾';
        try { localStorage.setItem(THEME_KEY, t); } catch {}
      }
      const savedTheme = (() => {
        try { return localStorage.getItem(THEME_KEY); } catch { return null; }
      })();
      const initialTheme =
        savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
      applyTheme(initialTheme);
      themeBtn.onclick = () => {
        const cur = document.documentElement.getAttribute('data-theme');
        applyTheme(cur === 'dark' ? 'light' : 'dark');
      };

      // ---------- Borrar historial ----------
      document.getElementById('clear-hist').onclick = clearHist;

      // ---------- Teclado ----------
      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const k = e.key;
        if ('0123456789.'.includes(k)) { input(k); e.preventDefault(); return; }
        if (k === '+') { inputOp('+'); e.preventDefault(); return; }
        if (k === '-') { inputOp('−'); e.preventDefault(); return; }
        if (k === '*') { inputOp('×'); e.preventDefault(); return; }
        if (k === '/') { inputOp('÷'); e.preventDefault(); return; }
        if (k === '^') { inputOp('^'); e.preventDefault(); return; }
        if (k === '(') { input('('); e.preventDefault(); return; }
        if (k === ')') { input(')'); e.preventDefault(); return; }
        if (k === '!') { input('!'); e.preventDefault(); return; }
        if (k === 'Enter' || k === '=') { evaluate(); e.preventDefault(); return; }
        if (k === 'Backspace') { backspace(); e.preventDefault(); return; }
        if (k === 'Escape') { clearAll(); e.preventDefault(); return; }
      });

      render();
    </script>
  </body>
</html>
